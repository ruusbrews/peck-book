  <rect x="355" y="385" width="100" height="180" rx="16" fill="#2e2118"/>
  <rect x="363" y="400" width="84" height="150" rx="6" fill="#fffaf2"/>
  <path d="M375 420 v-10 h10 M425 410 h10 v10 M435 530 v10 h-10 M385 540 h-10 v-10" stroke="#8a4b2f" stroke-width="3" fill="none"/>
