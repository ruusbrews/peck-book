  <rect x="848" y="112" width="304" height="26" rx="13" fill="#f7efe1"/>
  <text x="1000" y="131" font-size="15" font-weight="700" text-anchor="middle" fill="#8a4b2f">In Qatar: scan at every handover</text>

  <!-- Brazil ship -->
  <circle cx="230" cy="200" r="50" fill="#fffaf2" stroke="#e6d6bd" stroke-width="2"/>
  <path d="M196 206 H264 L254 226 H206 Z" fill="#5c3120"/>
  <rect x="206" y="186" width="16" height="18" fill="#8a4b2f"/>
