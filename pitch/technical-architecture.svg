    <circle cx="1076" cy="346" r="16" fill="#8a4b2f"/><text x="1076" y="352" font-size="16" text-anchor="middle" fill="#fff">4</text><text x="1100" y="352" font-size="15" fill="#8c7b6d">CHECK</text>
    <circle cx="1306" cy="346" r="16" fill="#8a4b2f"/><text x="1306" y="352" font-size="16" text-anchor="middle" fill="#fff">5</text><text x="1330" y="352" font-size="15" fill="#8c7b6d">ACT</text>
