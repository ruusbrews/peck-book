  <text x="40" y="92" font-size="18" fill="#8c7b6d">Sense → Scan → Reason → Check → Act</text>

  <!-- ===== Journey band ===== -->
  <line x1="230" y1="200" x2="1380" y2="200" stroke="#c9ad8a" stroke-width="3" stroke-dasharray="10 8"/>

