    <rect x="113" y="507" width="14" height="10" fill="#f28c8c"/><rect x="127" y="507" width="14" height="10" fill="#e84040"/><rect x="141" y="507" width="14" height="10" fill="#c01818"/><rect x="155" y="507" width="14" height="10" fill="#40d0f0"/><rect x="169" y="507" width="14" height="10" fill="#3060e0"/><rect x="183" y="507" width="14" height="10" fill="#0a20a0"/>
    <rect x="113" y="517" width="14" height="10" fill="#ffffff" stroke="#ddd" stroke-width="0.5"/><rect x="127" y="517" width="14" height="10" fill="#dddddd"/><rect x="141" y="517" width="14" height="10" fill="#aaaaaa"/><rect x="155" y="517" width="14" height="10" fill="#777777"/><rect x="169" y="517" width="14" height="10" fill="#444444"/><rect x="183" y="517" width="14" height="10" fill="#000000"/>
  </g>
  <g fill="#8a4b2f">
    <rect x="115" y="538" width="4" height="36"/><rect x="122" y="538" width="2" height="36"/><rect x="127" y="538" width="5" height="36"/><rect x="135" y="538" width="2" height="36"/><rect x="140" y="538" width="4" height="36"/><rect x="147" y="538" width="2" height="36"/><rect x="152" y="538" width="6" height="36"/><rect x="161" y="538" width="2" height="36"/><rect x="166" y="538" width="4" height="36"/><rect x="173" y="538" width="2" height="36"/><rect x="178" y="538" width="5" height="36"/><rect x="186" y="538" width="2" height="36"/><rect x="191" y="538" width="5" height="36"/>
